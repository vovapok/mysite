<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="1400" height="840" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="700" height="420" fill="#17181a"/>
  <text x="350" y="44" fill="#E6E7EA" font-size="17" font-weight="600" text-anchor="middle">Доля рынка десктопных ОС в мире (октябрь 2026, %)</text>

  <!-- grid -->
  <g stroke="#2A2C30" stroke-width="1">
    <line x1="150" y1="70" x2="150" y2="335"/>
    <line x1="204.4" y1="70" x2="204.4" y2="335"/>
    <line x1="258.9" y1="70" x2="258.9" y2="335"/>
    <line x1="313.3" y1="70" x2="313.3" y2="335"/>
    <line x1="367.8" y1="70" x2="367.8" y2="335"/>
    <line x1="422.2" y1="70" x2="422.2" y2="335"/>
    <line x1="476.7" y1="70" x2="476.7" y2="335"/>
    <line x1="531.1" y1="70" x2="531.1" y2="335"/>
    <line x1="585.6" y1="70" x2="585.6" y2="335"/>
    <line x1="640" y1="70" x2="640" y2="335"/>
  </g>

  <!-- bars -->
  <rect x="150" y="82" width="417.3" height="38" rx="6" fill="#E4E6EA"/>
  <rect x="150" y="152" width="85.3" height="38" rx="6" fill="#B9BCC2"/>
  <rect x="150" y="222" width="30.6" height="38" rx="6" fill="#8E9199"/>
  <rect x="150" y="292" width="11.1" height="38" rx="5" fill="#6A6D75"/>

  <!-- category labels -->
  <g fill="#A9ACB3" font-size="12" text-anchor="end">
    <text x="136" y="105">Windows</text>
    <text x="136" y="175">macOS / OS X</text>
    <text x="136" y="245">Linux</text>
    <text x="136" y="315">Chrome OS</text>
  </g>

  <!-- value labels -->
  <g fill="#E6E7EA" font-size="12" font-weight="600">
    <text x="575" y="105">76,65%</text>
    <text x="243" y="175">15,67%</text>
    <text x="189" y="245">5,63%</text>
    <text x="170" y="315">2,04%</text>
  </g>

  <!-- x axis -->
  <g fill="#7C7F87" font-size="11" text-anchor="middle">
    <text x="150" y="354">0%</text>
    <text x="204.4" y="354">10%</text>
    <text x="258.9" y="354">20%</text>
    <text x="313.3" y="354">30%</text>
    <text x="367.8" y="354">40%</text>
    <text x="422.2" y="354">50%</text>
    <text x="476.7" y="354">60%</text>
    <text x="531.1" y="354">70%</text>
    <text x="585.6" y="354">80%</text>
    <text x="640" y="354">90%</text>
  </g>
  <text x="395" y="388" fill="#A9ACB3" font-size="12" font-weight="600" text-anchor="middle">Доля рынка, %</text>
</svg>
